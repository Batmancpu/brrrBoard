<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">BR Brain: on-device typing intelligence</title>
  <desc id="desc">Premium sapphire editorial illustration of BR Brain with local next-word suggestions, Smart Emoji, swipe correction learning, and measured performance. Not an app screenshot or trained neural model depiction.</desc>
