    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEBFF"/></linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE8A7"/><stop offset="1" stop-color="#F8A850"/></linearGradient>
