<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="544" viewBox="0 0 1440 544" role="img" aria-labelledby="title desc">
  <title id="title">Zero internet permission. Zero keyboard uploads.</title>
  <desc id="desc">An editorial illustration with an isolated local shield, privacy seal and a clear promise that brrBoard does not request internet access or upload keyboard data itself.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAFCFF"/><stop offset=".7" stop-color="#EDF5FF"/><stop offset="1" stop-color="#DFEDFF"/></linearGradient>
    <radialGradient id="aura" cx="28%" cy="46%" r="48%"><stop stop-color="#BBD8FF" stop-opacity=".8"/><stop offset="1" stop-color="#D7E9FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3989F0"/><stop offset="1" stop-color="#103E96"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58AF84"/><stop offset="1" stop-color="#176C62"/></linearGradient>
  </defs>
  <rect width="1440" height="544" rx="37" fill="url(#paper)"/>
  <rect width="1440" height="544" rx="37" fill="url(#aura)"/>
  <circle cx="288" cy="259" r="222" fill="none" stroke="#B1CEE9" stroke-width="2" stroke-opacity=".65"/>
  <circle cx="288" cy="259" r="184" fill="none" stroke="#A1C5EC" stroke-width="2" stroke-opacity=".55"/>
  <circle cx="288" cy="259" r="143" fill="#FFFFFF" fill-opacity=".51"/>
  <path d="m288 123 115 44v87c0 89-56 147-115 182-59-35-115-93-115-182v-87z" fill="#A6C3EC" opacity=".37" transform="translate(6 11)"/>
  <path d="m288 123 115 44v87c0 89-56 147-115 182-59-35-115-93-115-182v-87z" fill="url(#sapphire)" stroke="#EAF5FF" stroke-width="5"/>
  <path d="m237 274 38 38 72-81" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M350 147c5-12 19-24 35-23-7 22-20 31-35 23" fill="url(#leaf)" stroke="#D8F6E9" stroke-opacity=".8" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="568" y="120" font-size="17" font-weight="760" letter-spacing="3.2" fill="#4F78AB">PRIVACY IS THE FOUNDATION</text>
    <text x="561" y="204" font-size="72" font-weight="780" letter-spacing="-3.5" fill="#123966">Zero internet.</text>
    <text x="566" y="263" font-size="39" font-weight="730" letter-spacing="-1.3" fill="#1D548F">Zero keyboard uploads.</text>
    <text x="570" y="320" font-size="22" fill="#44688F">Real typing intelligence. No network permission.</text>
    <text x="570" y="351" font-size="22" fill="#44688F">What you type is processed on your device.</text>
    <rect x="564" y="397" width="239" height="52" rx="26" fill="#C8DDF6" fill-opacity=".51" stroke="#A7C9ED"/>
    <circle cx="591" cy="423" r="7" fill="#2D936F"/>
    <text x="611" y="430" font-size="16" font-weight="720" fill="#17476F">NO INTERNET ACCESS</text>
    <rect x="820" y="397" width="215" height="52" rx="26" fill="#C8DDF6" fill-opacity=".51" stroke="#A7C9ED"/>
    <circle cx="846" cy="423" r="7" fill="#2D936F"/>
    <text x="866" y="430" font-size="16" font-weight="720" fill="#17476F">LOCAL LEARNING</text>
    <rect x="1052" y="397" width="286" height="52" rx="26" fill="#C8DDF6" fill-opacity=".51" stroke="#A7C9ED"/>
    <circle cx="1078" cy="423" r="7" fill="#2D936F"/>
    <text x="1098" y="430" font-size="16" font-weight="720" fill="#17476F">NO ADS OR TRACKING</text>
  </g>
  <rect x="2" y="2" width="1436" height="540" rx="35" fill="none" stroke="#ACC9EB" stroke-width="3" stroke-opacity=".62"/>
</svg>
