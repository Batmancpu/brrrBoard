# Publish the signed APK from main with a monotonically increasing version.
# Release checkpoint: B01-B03 test fixes and B04 panel transition guards; Reno10 acceptance pending.
name: brrBoard Obtainium Release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      # Release notes are bundled into version_history.json; a notes-only
      # repair must be able to recover a failed same-SHA release gate.
      - 'docs/releases/notes.json'
      - '.github/workflows/obtainium-release.yml'
  workflow_dispatch:
    inputs:
      bundle_ultra_model:
        description: 'Include the pinned Parakeet Ultra 0.6B model for this update (about 640 MiB)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

# Serial signed publication remains independent of the commit-scoped debug gate.
# Branch documentation pushes no longer cancel the required debug verification.
concurrency:
  group: brrrboard-obtainium-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine whether this push changes the shipped app
        id: release_scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle_ultra=false
          if [[ "$GITHUB_EVENT_NAME" != "push" || -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "product_changed=true" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              if [[ "${{ inputs.bundle_ultra_model }}" == "true" ]]; then
                bundle_ultra=true
              fi
            fi
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Ev '^app/src/test/' || true)"
            if grep -Eq '^(app/|buildSrc/|gradle/|tools/make-emoji-keys/|tools/fetch-board-|tools/verify-(voice-model|gtcrn|brrclean|voice-endpoints)-packaging\.sh$|build.gradle.kts$|settings.gradle.kts$|gradle.properties$|gradlew(\.bat)?$)' <<< "$changed_files"; then
              echo "product_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "product_changed=false" >> "$GITHUB_OUTPUT"
              echo "No shipped application or build inputs changed; signing/publication will be skipped."
            fi
          fi
          special=false
          # This one-time batch survives CI repairs. A published signed APK consumes it.
          prior="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and (.body // "" | contains("<!-- brrboard-compatibility-edition-20261128 -->")) and any(.assets[]?; .name == "brrBoard.apk" and .size > 600000000)) | .tag_name')"
          if [[ -z "$prior" && -f docs/releases/compatibility-edition-20261128 ]]; then
            special=true
            bundle_ultra=true
          fi
          echo "special=$special" >> "$GITHUB_OUTPUT"
          if [[ "$bundle_ultra" == true ]]; then
            model_mode=ultra
          else
            model_mode=unbundled
          fi
          echo "bundle_ultra=$bundle_ultra" >> "$GITHUB_OUTPUT"
          echo "model_mode=$model_mode" >> "$GITHUB_OUTPUT"
      - name: Check signing enrollment
        if: github.event_name != 'push' || steps.release_scope.outputs.product_changed == 'true'
        env:
          EXPECTED_CERT: ${{ vars.OBTAINIUM_CERT_SHA256 || secrets.OBTAINIUM_CERT_SHA256 }}
        run: |
          if [[ ! "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set OBTAINIUM_CERT_SHA256 under Actions Variables or Secrets to a 64-character lowercase fingerprint."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned private ASR native runtime
        run: bash tools/fetch-board-sherpa-onnx.sh
      - name: Stage pinned GTCRN enhancement model inside every APK
        run: bash tools/fetch-board-gtcrn.sh
      - name: Stage pinned brrClean native GTCRN weights inside every APK
        run: bash tools/fetch-board-brrclean.sh
      - name: Fetch and verify adaptive voice models
        run: bash tools/fetch-board-voice-endpoints.sh
      - name: Bundle pinned Parakeet Ultra only when explicitly requested
        if: steps.release_scope.outputs.bundle_ultra == 'true'
        run: bash tools/prepare-ultra-voice-pack.sh
      - name: Validate premium Settings navigation and resource contract
        run: python3 tools/check_premium_settings_contract.py
      - name: Assemble offline Version History from signed GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/brrBoard-prior-releases.json"
          python3 -m unittest discover -s tools -p 'test_generate_version_history.py' -v
          python3 tools/generate_version_history.py \
            --releases-json "$RUNNER_TEMP/brrBoard-prior-releases.json" \
            --version "1.0.$GITHUB_RUN_NUMBER" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --commit "$GITHUB_SHA" \
            --output app/src/main/assets/version_history.json \
            --release-notes-output "$RUNNER_TEMP/brrBoard-release-notes.md"
      - name: Build unsigned APK
        env:
          SPECIAL_EDITION: ${{ steps.release_scope.outputs.special }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleObtainium -PobtainiumBuild="$GITHUB_RUN_NUMBER" -PcompatibilityEdition="$SPECIAL_EDITION" -PsourceRevision="$GITHUB_SHA"
      - name: Verify ContextLM stays opt-in and bounded in the APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/obtainium -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          python3 tools/verify_contextlm_experiment_packaging.py "$apk"
      # The complete Android unit suite runs once in the exact-SHA debug gate.
      # Publication below remains blocked until that independent run succeeds.
      # Never bypass that gate; duplicating the suite here wastes CI minutes.
      - name: Validate deterministic brrPersonal seed generator (B16A)
        run: python3 -m unittest discover -s tools -p 'test_prepare_brrpersonal.py' -v
      - name: Verify offline-only mic routing and optional-model packaging contract
        run: python3 -m unittest discover -s tools -p 'test_bundled_voice_contract.py' -v
      - name: Verify private offline voice processing and stable mic routing
        run: python3 -m unittest discover -s tools -p 'test_offline_voice_contract.py' -v

      - name: Validate synthetic next-word comparison safety gate (B16B)
        run: python3 -m unittest discover -s tools -p 'test_evaluate_ngram_predictions.py' -v
      - name: Validate ContextLM public-data and failed-gate safeguards
        run: python3 -m unittest discover -s tools -p 'test_contextlm_training_contract.py' -v
      - name: Require same-commit debug CI success before signing or publishing
        if: github.event_name != 'push' || steps.release_scope.outputs.product_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&head_sha=$GITHUB_SHA" --jq '.workflow_runs | map(select(.path == ".github/workflows/brrrboard-build-debug.yml" and .event == "push")) | first | [.head_sha, .status, (.conclusion // "pending")] | join(" ")')"
            if [[ -n "$run_info" ]]; then
              read -r observed_sha status conclusion <<< "$run_info"
              if [[ "$observed_sha" == "$GITHUB_SHA" && "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "Exact-commit debug build/unit tests passed: $GITHUB_SHA"
                  exit 0
                fi
                echo "::error::Debug workflow finished $conclusion; refuse original signing."
                exit 1
              fi
            fi
            echo "Waiting for exact-commit debug CI (attempt $attempt/60)..."
            sleep 20
          done
          echo "::error::Debug workflow did not reach success within 20 minutes."
          exit 1
      - name: Sign and verify APK
        if: github.event_name != 'push' || steps.release_scope.outputs.product_changed == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OBTAINIUM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OBTAINIUM_KEYSTORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.OBTAINIUM_CERT_SHA256 || secrets.OBTAINIUM_CERT_SHA256 }}
          BUNDLE_MODE: ${{ steps.release_scope.outputs.model_mode }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing OBTAINIUM_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing OBTAINIUM_KEYSTORE_PASSWORD}"
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/signing.p12"
          keystore_cert="$(keytool -exportcert -keystore "$work/signing.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -alias brrrboard | sha256sum | cut -d' ' -f1)"
          if [[ "$keystore_cert" != "$EXPECTED_CERT" ]]; then
            echo "::error::The uploaded keystore certificate differs from the pinned signer."
            exit 1
          fi
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$sdk_tools"
          sdk_tools="$(dirname "$sdk_tools")"
          unsigned=(app/build/outputs/apk/obtainium/*.apk)
          test "${#unsigned[@]}" -eq 1
          test -s "${unsigned[0]}"
          unzip -p "${unsigned[0]}" assets/version_history.json | python3 -c 'import json,os,sys; assert json.load(sys.stdin)["releases"][0]["version"] == "1.0." + os.environ["GITHUB_RUN_NUMBER"]'
          "$sdk_tools/zipalign" -P 16 -f 4 "${unsigned[0]}" "$work/aligned.apk"
          apk="$RUNNER_TEMP/brrBoard.apk"
          "$sdk_tools/apksigner" sign --ks "$work/signing.p12" --ks-key-alias brrrboard \
            --ks-pass env:KEYSTORE_PASSWORD --out "$apk" "$work/aligned.apk"
          cert="$("$sdk_tools/apksigner" verify --print-certs "$apk" | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]{64})[[:space:]]*$/\1/p' | tr '[:upper:]' '[:lower:]' | sort -u)"
          if [[ "$cert" != "$EXPECTED_CERT" ]]; then
            echo "::error::Signing certificate differs from the pinned signer."
            exit 1
          fi
          apk_permissions="$("$sdk_tools/aapt" dump permissions "$apk")"
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' <<< "$apk_permissions"; then
            echo "::error::Offline brrBoard APK declares a network permission."
            exit 1
          fi
          if unzip -Z1 "$apk" | grep -Fx 'assets/default_backup.zip' >/dev/null; then
            echo "::error::The APK contains a full settings backup."
            exit 1
          fi
          python3 -m unittest discover -s tools -p 'test_audit_public_apk.py' -v
          python3 tools/audit_public_apk.py --apk "$apk"
          bash tools/verify-voice-model-packaging.sh "$apk" "$BUNDLE_MODE"
          bash tools/verify-gtcrn-packaging.sh "$apk"
          bash tools/verify-brrclean-packaging.sh "$apk"
          bash tools/verify-voice-endpoints-packaging.sh "$apk"
          python3 tools/verify_clean_dictionary_assets.py "$apk"
          badging="$("$sdk_tools/aapt" dump badging "$apk")"
          grep -Fx "application-label:'brrBoard'" <<< "$badging"
          package="${badging%%$'\n'*}"
          [[ "$package" == "package: name='com.mangoloads.board' versionCode='$GITHUB_RUN_NUMBER' versionName='1.0.$GITHUB_RUN_NUMBER'"* ]]
          printf 'APK=%s\nSHA256=%s\n' "$apk" "$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        if: github.event_name != 'push' || steps.release_scope.outputs.product_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_MODE: ${{ steps.release_scope.outputs.model_mode }}
          SPECIAL_EDITION: ${{ steps.release_scope.outputs.special }}
        run: |
          set -euo pipefail
          version="1.0.$GITHUB_RUN_NUMBER"
          last_run="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and ((.name | (startswith("brrBoard Obtainium ") or startswith("brrrBoard Obtainium "))) or (.body // "" | contains("<!-- brrboard-compatibility-edition-20261128 -->")))) | .tag_name | select(test("^v1\\.0\\.[0-9]+$")) | split(".") | last' \
            | sort -n | tail -n 1)"
          if [[ -n "$last_run" ]] && (( last_run >= GITHUB_RUN_NUMBER )); then
            echo "An equal or newer Obtainium release is already published."
            exit 0
          fi
          model_note='No Parakeet model weights in this update; retains the previously installed verified private model.'
          if [[ "$BUNDLE_MODE" == 'ultra' ]]; then
            model_note='Includes SHA-256-verified Parakeet Ultra 0.6B INT8 for offline dictation; no legacy 110M weights. Allow roughly 700 MiB of additional app storage.'
          fi
          printf '\n%s\nThe 535 KB GTCRN denoising model is bundled permanently in this APK; no audio is uploaded or model fetched at runtime.\nAPK SHA-256: %s.\n' "$model_note" "$SHA256" >> "$RUNNER_TEMP/brrBoard-release-notes.md"
          release_title="brrBoard Obtainium $version"
          if [[ "$SPECIAL_EDITION" == true ]]; then
            [[ "$BUNDLE_MODE" == ultra ]]
            release_title="Yashthetic 69"
            printf '\n<!-- brrboard-compatibility-edition-20261128 -->\n' >> "$RUNNER_TEMP/brrBoard-release-notes.md"
          fi
          gh release create "v$version" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$release_title" --latest \
            --notes-file "$RUNNER_TEMP/brrBoard-release-notes.md"
