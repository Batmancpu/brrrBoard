# Publish the signed APK from main with a monotonically increasing version.
# Release checkpoint: B01-B03 test fixes and B04 panel transition guards; Reno10 acceptance pending.
name: brrBoard Obtainium Release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/obtainium-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: brrrboard-obtainium-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check signing enrollment
        env:
          EXPECTED_CERT: ${{ vars.OBTAINIUM_CERT_SHA256 || secrets.OBTAINIUM_CERT_SHA256 }}
        run: |
          if [[ ! "$EXPECTED_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set OBTAINIUM_CERT_SHA256 under Actions Variables or Secrets to a 64-character lowercase fingerprint."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned private ASR native runtime
        run: bash tools/fetch-board-sherpa-onnx.sh
      - name: Bundle pinned English ASR model inside the regular APK
        run: bash tools/prepare-offline-voice-pack.sh
      - name: Build unsigned APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleObtainium -PobtainiumBuild="$GITHUB_RUN_NUMBER"
      - name: Run complete Android unit test gate before publishing
        run: ./gradlew --no-daemon --stacktrace testRunTests
      - name: Validate deterministic brrPersonal seed generator (B16A)
        run: python3 -m unittest discover -s tools -p 'test_prepare_brrpersonal.py' -v
      - name: Verify offline-only mic routing and bundled-model contract
        run: python3 -m unittest discover -s tools -p 'test_bundled_voice_contract.py' -v

      - name: Validate synthetic next-word comparison safety gate (B16B)
        run: python3 -m unittest discover -s tools -p 'test_evaluate_ngram_predictions.py' -v
      - name: Require same-commit debug CI success before signing or publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run_info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&head_sha=$GITHUB_SHA" --jq '.workflow_runs | map(select(.path == ".github/workflows/brrrboard-build-debug.yml" and .event == "push")) | first | [.head_sha, .status, (.conclusion // "pending")] | join(" ")')"
            if [[ -n "$run_info" ]]; then
              read -r observed_sha status conclusion <<< "$run_info"
              if [[ "$observed_sha" == "$GITHUB_SHA" && "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "Exact-commit debug build/unit tests passed: $GITHUB_SHA"
                  exit 0
                fi
                echo "::error::Debug workflow finished $conclusion; refuse original signing."
                exit 1
              fi
            fi
            echo "Waiting for exact-commit debug CI (attempt $attempt/60)..."
            sleep 20
          done
          echo "::error::Debug workflow did not reach success within 20 minutes."
          exit 1
      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OBTAINIUM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OBTAINIUM_KEYSTORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.OBTAINIUM_CERT_SHA256 || secrets.OBTAINIUM_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing OBTAINIUM_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing OBTAINIUM_KEYSTORE_PASSWORD}"
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work/signing.p12"
          keystore_cert="$(keytool -exportcert -keystore "$work/signing.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -alias brrrboard | sha256sum | cut -d' ' -f1)"
          if [[ "$keystore_cert" != "$EXPECTED_CERT" ]]; then
            echo "::error::The uploaded keystore certificate differs from the pinned signer."
            exit 1
          fi
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$sdk_tools"
          sdk_tools="$(dirname "$sdk_tools")"
          unsigned=(app/build/outputs/apk/obtainium/*.apk)
          test "${#unsigned[@]}" -eq 1
          test -s "${unsigned[0]}"
          "$sdk_tools/zipalign" -P 16 -f 4 "${unsigned[0]}" "$work/aligned.apk"
          apk="$RUNNER_TEMP/brrBoard.apk"
          "$sdk_tools/apksigner" sign --ks "$work/signing.p12" --ks-key-alias brrrboard \
            --ks-pass env:KEYSTORE_PASSWORD --out "$apk" "$work/aligned.apk"
          cert="$("$sdk_tools/apksigner" verify --print-certs "$apk" | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]{64})[[:space:]]*$/\1/p' | tr '[:upper:]' '[:lower:]' | sort -u)"
          if [[ "$cert" != "$EXPECTED_CERT" ]]; then
            echo "::error::Signing certificate differs from the pinned signer."
            exit 1
          fi
          apk_permissions="$("$sdk_tools/aapt" dump permissions "$apk")"
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' <<< "$apk_permissions"; then
            echo "::error::Offline brrBoard APK declares a network permission."
            exit 1
          fi
          if unzip -Z1 "$apk" | grep -Fx 'assets/default_backup.zip' >/dev/null; then
            echo "::error::The APK contains a full settings backup."
            exit 1
          fi
          # Verify all four exact pinned weights inside the signed deliverable.
          bash tools/verify-bundled-voice-model.sh "$apk"
          for dict in main_hi-Latn emoji_hi-Latn emoji_en-IN; do
            unzip -p "$apk" "assets/dicts/$dict.dict" | cmp - "app/src/main/assets/dicts/$dict.dict"
          done
          badging="$("$sdk_tools/aapt" dump badging "$apk")"
          grep -Fx "application-label:'brrBoard'" <<< "$badging"
          package="${badging%%$'\n'*}"
          [[ "$package" == "package: name='com.mangoloads.board' versionCode='$GITHUB_RUN_NUMBER' versionName='1.0.$GITHUB_RUN_NUMBER'"* ]]
          printf 'APK=%s\nSHA256=%s\n' "$apk" "$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="1.0.$GITHUB_RUN_NUMBER"
          last_run="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and (.name | (startswith("brrBoard Obtainium ") or startswith("brrrBoard Obtainium ")))) | .tag_name | select(test("^v1\\.0\\.[0-9]+$")) | split(".") | last' \
            | sort -n | tail -n 1)"
          if [[ -n "$last_run" ]] && (( last_run >= GITHUB_RUN_NUMBER )); then
            echo "An equal or newer Obtainium release is already published."
            exit 0
          fi
          gh release create "v$version" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "brrBoard Obtainium $version" --latest \
            --notes "Commit: $GITHUB_SHA. Includes verified offline English voice model; no separate download. APK SHA-256: $SHA256."
