name: brrrBoard — Initialize Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate dedicated brrrBoard signing bundle
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/brrrBoard-signing"
          mkdir -p "$WORK"

          STORE_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          KEY_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          KEY_ALIAS="brrrBoard"

          keytool -genkeypair \
            -keystore "$WORK/brrrBoard-release.jks" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=brrrBoard, OU=mangoloads, O=mangoloads, L=Unknown, ST=Unknown, C=IN"

          cat > "$WORK/metadata.json" <<EOF
{
  "keystore_password": "$STORE_PASSWORD",
  "key_alias": "$KEY_ALIAS",
  "key_password": "$KEY_PASSWORD"
}
EOF

          cd "$WORK"
          zip -j "$GITHUB_WORKSPACE/brrrBoard-signing-bundle.zip" brrrBoard-release.jks metadata.json
          base64 -w 0 "$GITHUB_WORKSPACE/brrrBoard-signing-bundle.zip" > "$GITHUB_WORKSPACE/BRRRBOARD_SIGNING_BUNDLE.txt"

          cat > "$GITHUB_WORKSPACE/README-SIGNING-SETUP.txt" <<'EOF'
brrrBoard signing setup

1. Keep brrrBoard-signing-bundle.zip somewhere safe as the private signing-key backup.
2. Open BRRRBOARD_SIGNING_BUNDLE.txt.
3. Copy its entire contents.
4. In GitHub:
   Settings -> Secrets and variables -> Actions -> New repository secret
5. Name the secret:
   BRRRBOARD_SIGNING_BUNDLE
6. Paste the copied value and save it.
EOF

          echo "Signing bundle generated."
          echo "Create exactly one repository secret: BRRRBOARD_SIGNING_BUNDLE"

      - name: Upload signing bundle and setup instructions
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-signing-setup
          path: |
            brrrBoard-signing-bundle.zip
            BRRRBOARD_SIGNING_BUNDLE.txt
            README-SIGNING-SETUP.txt
          if-no-files-found: error
          retention-days: 1
