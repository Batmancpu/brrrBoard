name: Build and release brrrBoard APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brrrBoard-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore persistent signing key
        shell: bash
        run: |
          test -f .github/debug.keystore
          mkdir -p "$HOME/.android"
          cp .github/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testRunTestsUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-debug.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$APK" | cut -d' ' -f1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(( $(date +%s) / 60 ))"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="mango-${VERSION_NAME}-${VERSION_CODE}-${SHORT_SHA}"

          NOTES="$(cat <<EOF
Automated personal build from main.

Commit: ${GITHUB_SHA}
Version name: ${VERSION_NAME}
Version code floor: ${VERSION_CODE}

The debug APK is signed with the fork's persistent signing key so it can update previous brrrBoard debug installs without uninstalling.
EOF
)"

          gh release create "$TAG" "$APK" \
            --title "Mango brrrBoard ${VERSION_NAME} — ${SHORT_SHA}" \
            --notes "$NOTES"
