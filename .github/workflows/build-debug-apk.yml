name: brrrBoard — Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brrrBoard-test
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch or tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          export BRRR_BUILD_VERSION_CODE="$(date +%s)"
          export BRRR_BUILD_TIMESTAMP="$(TZ=Asia/Kolkata date +'%d %B %Y, %-I:%M %p')"
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk_path"
          test -s "$apk_path"
          sha256sum "$apk_path"
          ls -lh "$apk_path"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
