name: brrrBoard — Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brrrBoard-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          export BRRR_BUILD_VERSION_CODE="$(date +%s)"
          export BRRR_BUILD_TIMESTAMP="$(TZ=Asia/Kolkata date +'%d %B %Y, %-I:%M %p')"
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          sha256sum "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
