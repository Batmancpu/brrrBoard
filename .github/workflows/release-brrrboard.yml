name: brrrBoard — Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brrrBoard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore brrrBoard signing bundle
        shell: bash
        env:
          BRRRBOARD_SIGNING_BUNDLE: \${{ secrets.BRRRBOARD_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$BRRRBOARD_SIGNING_BUNDLE"
          WORK="$RUNNER_TEMP/brrrBoard-signing"
          mkdir -p "$WORK"
          printf '%s' "$BRRRBOARD_SIGNING_BUNDLE" | base64 --decode > "$WORK/bundle.zip"
          unzip -q "$WORK/bundle.zip" -d "$WORK/unpacked"

          test -s "$WORK/unpacked/brrrBoard-release.jks"

          STORE_PASSWORD="$(jq -r '.keystore_password' "$WORK/unpacked/metadata.json")"
          KEY_ALIAS="$(jq -r '.key_alias' "$WORK/unpacked/metadata.json")"
          KEY_PASSWORD="$(jq -r '.key_password' "$WORK/unpacked/metadata.json")"

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "BRRRBOARD_KEYSTORE_PATH=$WORK/unpacked/brrrBoard-release.jks" >> "$GITHUB_ENV"
          echo "BRRRBOARD_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BRRRBOARD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BRRRBOARD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set release identity
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="\${GITHUB_SHA::7}"
          BUILD_STAMP="$(TZ=Asia/Kolkata date +'%d%m%y%H%M')"
          VERSION_CODE="$(date +%s)"
          BUILD_TIMESTAMP="$(TZ=Asia/Kolkata date +'%d %B %Y, %-I:%M %p')"
          TAG="brrrBoard-\${BUILD_STAMP}-\${SHORT_SHA}"

          echo "BRRR_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "BRRR_BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"
          echo "BRRR_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace -PversionName=1.0.0 assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          SHA256="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          echo "BRRR_APK_SHA256=$SHA256" >> "$GITHUB_ENV"

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --verbose "$APK_PATH"
          ls -lh "$APK_PATH"
          echo "SHA-256: $SHA256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="Signed brrrBoard APK built from commit $GITHUB_SHA."
          NOTES="$NOTES
Build: $BRRR_BUILD_TIMESTAMP"
          NOTES="$NOTES
Version code: $BRRR_VERSION_CODE"
          NOTES="$NOTES
APK SHA-256: $BRRR_APK_SHA256"

          gh release create "$BRRR_TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "brrrBoard — $BRRR_BUILD_TIMESTAMP" \
            --notes "$NOTES"
