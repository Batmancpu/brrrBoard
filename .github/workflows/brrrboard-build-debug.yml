name: brrrBoard — Build Debug APK

on:
  push:
    branches:
      - main
      - 'brrrboard-audit-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brrrBoard-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether this commit changes the app
        id: release_scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" || -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "product_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
          if grep -Eq '^(app/|buildSrc/|gradle/|tools/make-emoji-keys/|build.gradle.kts$|settings.gradle.kts$|gradle.properties$|gradlew(\.bat)?$)' <<< "$changed_files"; then
            echo "product_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "product_changed=false" >> "$GITHUB_OUTPUT"
            echo "No application or build inputs changed; CI will run without publishing a release."
          fi

      - name: Restore persistent debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/debug.keystore
          mkdir -p "$HOME/.android"
          cp .github/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Robolectric SDK 36 requires JDK 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Record generated brrPersonal dictionary fingerprint
        shell: bash
        run: |
          set -euo pipefail
          DICTIONARY="app/src/main/assets/brrPersonal.tsv"
          test -s "$DICTIONARY"
          ENTRY_COUNT="$(grep -c -v '^#' "$DICTIONARY")"
          test "$ENTRY_COUNT" -gt 0
          echo "brrPersonal entries: $ENTRY_COUNT"
          sha256sum "$DICTIONARY"

      - name: Verify APK and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-debug.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"

          EXPECTED_CERT="$(keytool -list -v -keystore .github/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^.*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          test "$EXPECTED_CERT" = "$ACTUAL_CERT"

          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c '%s' "$APK")" >> "$GITHUB_ENV"

          echo "APK: $APK"
          echo "SHA-256: $SHA256"
          ls -lh "$APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-debug-apk-${{ github.sha }}
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace testRunTests

      - name: Validate deterministic brrPersonal seed generator (B16A)
        if: steps.unit_tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_prepare_brrpersonal.py' -v

      - name: Validate synthetic next-word comparison safety gate (B16B)
        if: steps.unit_tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_evaluate_ngram_predictions.py' -v

      - name: Print Emoji classifier failure detail
        if: always() && steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "app/build/test-results/testRunTestsUnitTest/TEST-helium314.keyboard.latin.StringUtilsTest.xml"
          if os.path.exists(report):
              root = ET.parse(report).getroot()
              for test in root.iter("testcase"):
                  if test.get("name") == "isEmojiDetectsAllAvailableEmojis":
                      failure = test.find("failure")
                      if failure is not None:
                          print("Emoji classifier failure:", failure.get("message", ""))
      - name: Upload JUnit reports for failed tests
        if: always() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-test-reports-${{ github.sha }}
          path: app/build/test-results/testRunTestsUnitTest/*.xml
          # Compiler failures may happen before JUnit XML exists; the explicit
          # unit_tests gate below still fails the job with the original cause.
          if-no-files-found: warn
          retention-days: 7

      - name: Fail workflow when tests fail
        if: steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "Unit tests failed; APK was still built, verified, and published for audit/testing."
          exit 1

      - name: Publish GitHub release
        if: steps.release_scope.outputs.product_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +'%Y%m%d-%H%M%S')"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="v${VERSION_NAME}-debug.${STAMP}-${SHORT_SHA}"
            TITLE="brrrBoard v${VERSION_NAME} Debug — ${SHORT_SHA}"
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "Debug/test APK. Commit: $GITHUB_SHA. SHA-256: $SHA256. Persistent debug signing key. Unit-test status: ${{ steps.unit_tests.outcome }}." --prerelease
          else
            TAG="brrrboard-test-${STAMP}-${SHORT_SHA}"
            TITLE="brrrBoard Test Build — ${SHORT_SHA}"
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "Audit/test build. Commit: $GITHUB_SHA. SHA-256: $SHA256." --prerelease
          fi
