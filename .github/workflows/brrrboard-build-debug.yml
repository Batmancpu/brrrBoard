name: brrrBoard — Build Debug APK

on:
  push:
    branches:
      - '**'
    paths:
      - 'app/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'tools/**'
      - 'docs/releases/notes.json'
      - '.github/workflows/obtainium-release.yml'
      - '.github/workflows/brrrboard-build-debug.yml'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  # Keep one debug verification for each exact SHA until it finishes.
  # A later documentation push must not cancel a release's same-commit gate.
  group: brrrBoard-debug-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify MangoLoads identity resources and motion contract
        run: python3 -m unittest discover -s tools/tests -p 'test_mangoloads_brand.py' -v

      - name: Verify workflow security and unit-test gate contract
        run: python3 -m unittest discover -s tools/tests -p 'test_ci_workflow_contract.py' -v

      - name: Reject known private-content diagnostic logs
        run: python3 -m unittest discover -s tools/tests -p 'test_private_log_contract.py' -v

      - name: Validate premium Settings navigation and resource contract
        run: python3 tools/check_premium_settings_contract.py

      - name: Require per-release change notes for application updates
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then exit 0; fi
          # GitHub may still report the previous branch tip for a force-push
          # even when that object is no longer reachable from the advertised
          # refs. Use the PR base merge-base in that case so the notes gate
          # validates the actual candidate diff instead of failing on a bad SHA.
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            diff_base="$BEFORE_SHA"
          else
            git fetch --no-tags origin main
            diff_base="$(git merge-base origin/main "$GITHUB_SHA")"
          fi
          changes="$(git diff --name-only "$diff_base" "$GITHUB_SHA")"
          if grep -Eq '^(app/|buildSrc/|gradle/|tools/(make-emoji-keys/|fetch-board-|verify-(voice-model|gtcrn|brrclean|voice-endpoints)-packaging\.sh$)|build.gradle.kts$|settings.gradle.kts$|gradle.properties$|gradlew(\.bat)?$)' <<< "$changes" &&
             ! grep -Fxq 'docs/releases/notes.json' <<< "$changes"; then
            echo '::error::Update docs/releases/notes.json with exact user-visible changes for this application update.'
            exit 1
          fi

      - name: Validate bundled Version History catalog
        run: |
          python3 -m unittest discover -s tools -p 'test_generate_version_history.py' -v
          python3 tools/generate_version_history.py --output app/src/main/assets/version_history.json

      - name: Restore persistent debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/debug.keystore
          mkdir -p "$HOME/.android"
          cp .github/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Robolectric SDK 36 requires JDK 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned private ASR native runtime
        run: bash tools/fetch-board-sherpa-onnx.sh
      - name: Stage pinned GTCRN enhancement model inside APK
        run: bash tools/fetch-board-gtcrn.sh
      - name: Stage pinned brrClean native GTCRN weights inside APK
        run: bash tools/fetch-board-brrclean.sh
      - name: Fetch and verify adaptive voice models
        run: bash tools/fetch-board-voice-endpoints.sh
      - name: Execute pinned speech endpoint models on CPU
        run: |
          python3 -m venv "$RUNNER_TEMP/voice-model-smoke"
          "$RUNNER_TEMP/voice-model-smoke/bin/pip" install --disable-pip-version-check onnxruntime==1.23.2 'numpy<3'
          "$RUNNER_TEMP/voice-model-smoke/bin/python" tools/test_voice_endpoint_models.py
      - name: Verify native GTCRN against pinned model on host
        run: |
          g++ -std=c++17 -O2 -I app/src/main/jni/brrclean \
            tools/test_brrclean_native.cpp app/src/main/jni/brrclean/gtcrn.cpp \
            app/src/main/jni/brrclean/stft.cpp -o "$RUNNER_TEMP/brrclean-host-smoke"
          "$RUNNER_TEMP/brrclean-host-smoke" app/src/main/assets/voice/brrclean_gtcrn.weights
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Record generated brrPersonal dictionary fingerprint
        shell: bash
        run: |
          set -euo pipefail
          DICTIONARY="app/src/main/assets/brrPersonal.tsv"
          test -s "$DICTIONARY"
          ENTRY_COUNT="$(grep -c -v '^#' "$DICTIONARY")"
          test "$ENTRY_COUNT" -gt 0
          echo "brrPersonal entries: $ENTRY_COUNT"
          sha256sum "$DICTIONARY"

      - name: Verify APK and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*-debug.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -p "$APK" assets/version_history.json | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["releases"]) >= 2'
          python3 tools/verify_contextlm_experiment_packaging.py "$APK"
          bash tools/verify-voice-model-packaging.sh "$APK" unbundled
          bash tools/verify-gtcrn-packaging.sh "$APK"
          bash tools/verify-brrclean-packaging.sh "$APK"
          bash tools/verify-voice-endpoints-packaging.sh "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"

          EXPECTED_CERT="$(keytool -list -v -keystore .github/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^.*SHA256:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^.*SHA-256 digest:[[:space:]]*//p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          test -n "$EXPECTED_CERT"
          test -n "$ACTUAL_CERT"
          test "$EXPECTED_CERT" = "$ACTUAL_CERT"

          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c '%s' "$APK")" >> "$GITHUB_ENV"

          echo "APK: $APK"
          echo "SHA-256: $SHA256"
          ls -lh "$APK"

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace testRunTests

      - name: Validate deterministic brrPersonal seed generator (B16A)
        if: steps.unit_tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_prepare_brrpersonal.py' -v

      - name: Verify offline-only mic routing and optional-model packaging contract
        run: python3 -m unittest discover -s tools -p 'test_bundled_voice_contract.py' -v
      - name: Verify private offline voice processing and stable mic routing
        run: python3 -m unittest discover -s tools -p 'test_offline_voice_contract.py' -v
      - name: Verify optional voice models stay opt-in
        run: python3 -m unittest discover -s tools -p 'test_ultra_voice_packaging.py' -v

      - name: Validate synthetic next-word comparison safety gate (B16B)
        if: steps.unit_tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_evaluate_ngram_predictions.py' -v

      - name: Validate ContextLM public-data and failed-gate safeguards
        if: steps.unit_tests.outcome == 'success'
        run: python3 -m unittest discover -s tools -p 'test_contextlm_training_contract.py' -v

      - name: Print Emoji classifier failure detail
        if: always() && steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = "app/build/test-results/testRunTestsUnitTest/TEST-helium314.keyboard.latin.StringUtilsTest.xml"
          if os.path.exists(report):
              root = ET.parse(report).getroot()
              for test in root.iter("testcase"):
                  if test.get("name") == "isEmojiDetectsAllAvailableEmojis":
                      failure = test.find("failure")
                      if failure is not None:
                          print("Emoji classifier failure:", failure.get("message", ""))
      - name: Upload JUnit reports for failed tests
        if: always() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-test-reports-${{ github.sha }}
          path: app/build/test-results/testRunTestsUnitTest/*.xml
          # Compiler failures may happen before JUnit XML exists; the explicit
          # unit_tests gate below still fails the job with the original cause.
          if-no-files-found: warn
          retention-days: 7

      - name: Fail workflow when tests fail
        if: steps.unit_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "Android unit tests failed; the debug APK will not be uploaded as a verified artifact."
          exit 1

      - name: Upload verified debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrrBoard-debug-apk-${{ github.sha }}
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
